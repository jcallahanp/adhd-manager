name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Ledger updated with code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Code changes must come with a STATUS.md update and a task log
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          code="$(printf '%s\n' "$changed" | grep -v -E '^docs/(STATUS\.md|log/)' | grep -v -E '^\.claude/' || true)"
          [ -z "$code" ] && exit 0
          printf '%s\n' "$changed" | grep -q -E '^docs/STATUS\.md$' || { echo "::error::docs/STATUS.md was not updated"; exit 1; }
          printf '%s\n' "$changed" | grep -q -E '^docs/log/[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$' || { echo "::error::no docs/log entry for this change"; exit 1; }
      - name: Docs are consistent (ids, pointers, log sections, length caps)
        run: bash scripts/check-docs.sh

  build:
    # pnpm + Turborepo monorepo (D-002): turbo runs lint, typecheck, test and build in every app and package.
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make ci
