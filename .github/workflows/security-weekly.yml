name: security-weekly
# Catches new CVEs in code that has not changed, and tracks supply-chain posture.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/security-weekly.yml"]

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: vars.CODE_SCANNING == 'true'
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  trivy:
    name: Trivy rescan of main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-weekly.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: vars.CODE_SCANNING == 'true'
        with:
          sarif_file: trivy-weekly.sarif
          category: trivy-weekly
      - name: Keep the report when the Security tab is off
        if: vars.CODE_SCANNING != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-sarif
          path: "*.sarif"
